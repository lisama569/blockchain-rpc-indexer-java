server.port=0

# ===== 链上数据接入与索引器配置 =====
# 是否启动后台轮询（默认关闭；测试/手动注入节点时通过代码驱动）
indexer.enabled=false
# 轮询间隔（毫秒）
indexer.polling-interval-ms=500
# 节点落后网络链顶多少块即判定为"明显落后"，其数据不采信
indexer.max-stale-lag=2
# 重组期间固定使用的节点 id（留空表示按优先级正常分发）
indexer.pinned-node-id=
# 节点 RPC 超时阈值（毫秒，模拟节点的 latency 超过此值可视为超时）
indexer.rpc-timeout-ms=1000
